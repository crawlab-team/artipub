name: Check

on:
  pull_request:
  push:
    branches: [next]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: node --experimental-strip-types --test tests/bluesky.test.ts
